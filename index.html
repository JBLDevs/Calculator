<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Project</title>

    <!--For poppins library-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/calculator.css">
</head>
<body>
    <div class="calculator">
            
        <!--To combine the top display(first input and operator) and the current display-->
        <div class="display-container">
            <div class="fnumber-container"></div><!--<div class="fnumber"></div>-->
            <input type="text" id="display" value="" readonly>
        </div>

        <div class="buttons-container">
            <div class="container-1">
                <div class="buttons-cl-1"><button type="button" id="clear">C</button></div>
                <div class="buttons-cl-2"><button type="button" id="seven" value="7">7</button></div>
                <div class="buttons-cl-3"><button type="button" id="four" value="4">4</button></div>
                <div class="buttons-cl-4"><button type="button" id="one" value="1">1</button></div>
                <div class="buttons-cl-5"><button type="button" id="zero" value="0">0</button></div>
            </div>

            <div class="container-2">
                <div class="buttons-cl-6"><button type="button" id="delete">Del</button></div>
                <div class="buttons-cl-7"><button type="button" id="eight" value="8">8</button></div>
                <div class="buttons-cl-8"><button type="button" id="five" value="5">5</button></div>
                <div class="buttons-cl-9"><button type="button" id="two" value="2">2</button></div>
                <div class="buttons-cl-10"><button type="button" id="double-zero" value="00">00</button></div>
            </div>

            <div class="container-3">
                <div class="buttons-cl-11"><button type="button" id="division" value="/">/</button></div>
                <div class="buttons-cl-12"><button type="button" id="nine" value="9">9</button></div>
                <div class="buttons-cl-13"><button type="button" id="six" value="6">6</button></div>
                <div class="buttons-cl-14"><button type="button" id="three" value="3">3</button></div>
                <div class="buttons-cl-15"><button type="button" id="point" value=".">.</button></div>
            </div>

            <div class="container-4">
                <div class="buttons-cl-16"><button type="button" id="multiplication" value="*">x</button></div>
                <div class="buttons-cl-17"><button type="button" id="subtraction" value="-">-</button></div>
                <div class="buttons-cl-18"><button type="button" id="addition" value="+">+</button></div>
                <div class="buttons-cl-19"><button type="button" id="equal">=</button></div>
            </div>
        </div>        
    </div>
<div class="second-background"></div>
    <script src="js/script.js"></script>
</body>
</html>
